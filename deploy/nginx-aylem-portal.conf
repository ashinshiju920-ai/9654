# ==============================================================================
# Aylem Learning Student Portal — Nginx Reverse Proxy Configuration
# Target Domain: portal.aylemlearning.com (or server IP during initial setup)
# Upstream Next.js application: 127.0.0.1:3000
# ==============================================================================

# Rate limiting zone for authentication endpoints (defense-in-depth)
limit_req_zone $binary_remote_addr zone=aylem_auth_limit:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name portal.aylemlearning.com;

    # Redirect all HTTP requests to HTTPS once SSL certificate is active.
    # (Uncomment this block and comment out the proxy pass below after running Certbot)
    # return 301 https://$host$request_uri;

    # Maximum client body size for PDF / asset uploads
    client_max_body_size 25M;

    # Security Headers (Baseline)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Next.js static asset caching (immutable files)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000/_next/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Dedicated rate limiting for login and registration endpoints
    location /api/auth/login {
        limit_req zone=aylem_auth_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Primary Next.js application proxy
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}

